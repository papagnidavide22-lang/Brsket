name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Brsket version
      description: Brsket › About Brsket
      placeholder: "10.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Air M2, macOS 15.5
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link or kind of file
      description: Don't post private links.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened, and any message Brsket showed.
    validations:
      required: true
